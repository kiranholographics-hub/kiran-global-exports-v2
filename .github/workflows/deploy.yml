name: Deploy ADD-ONLY P1 Landing Pages to Hostinger

on:
  workflow_dispatch:

jobs:
  build-and-deploy-add-only:
    name: Build & Sync ADD-ONLY P1 files to Hostinger public_html
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build production bundle
        working-directory: ./frontend
        run: npm run build

      - name: Start Preview Server
        working-directory: ./frontend
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 &
          npx --yes wait-on http://127.0.0.1:4173

      - name: Render 9 Approved P1 Routes with Puppeteer
        working-directory: ./frontend
        run: |
          npm install --no-save puppeteer
          node -e "
          const puppeteer = require('puppeteer');
          const fs = require('fs');
          const path = require('path');

          const routes = [
            '/export/usa-cotton-towel-supplier',
            '/export/canada-cotton-towel-supplier',
            '/export/australia-cotton-towel-supplier',
            '/export/south-africa-cotton-towel-supplier',
            '/export/south-america-cotton-towel-supplier',
            '/export/uae-cotton-towel-supplier',
            '/export/saudi-arabia-cotton-towel-supplier',
            '/solutions/hotel-towel-manufacturer',
            '/solutions/private-label-towel-manufacturer'
          ];

          (async () => {
            const browser = await puppeteer.launch({
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            const page = await browser.newPage();

            for (const r of routes) {
              const url = 'http://127.0.0.1:4173' + r;
              console.log('Rendering:', url);
              await page.goto(url, { waitUntil: 'networkidle0', timeout: 30000 });
              await page.evaluate(() => new Promise(resolve => setTimeout(resolve, 1000)));

              const html = await page.content();
              const targetDir = path.join(__dirname, 'dist', r.slice(1));
              fs.mkdirSync(targetDir, { recursive: true });
              fs.writeFileSync(path.join(targetDir, 'index.html'), html, 'utf-8');
              console.log('Saved:', path.join('dist', r.slice(1), 'index.html'));
            }

            await browser.close();
          })();
          "

      - name: Verify 9 P1 Static HTML Files Exist
        working-directory: ./frontend
        run: |
          test -f dist/export/usa-cotton-towel-supplier/index.html
          test -f dist/export/canada-cotton-towel-supplier/index.html
          test -f dist/export/australia-cotton-towel-supplier/index.html
          test -f dist/export/south-africa-cotton-towel-supplier/index.html
          test -f dist/export/south-america-cotton-towel-supplier/index.html
          test -f dist/export/uae-cotton-towel-supplier/index.html
          test -f dist/export/saudi-arabia-cotton-towel-supplier/index.html
          test -f dist/solutions/hotel-towel-manufacturer/index.html
          test -f dist/solutions/private-label-towel-manufacturer/index.html

          echo "ALL 9 P1 HTML FILES VERIFIED WITH test -f:"
          ls -lh dist/export/usa-cotton-towel-supplier/index.html
          ls -lh dist/export/canada-cotton-towel-supplier/index.html
          ls -lh dist/export/australia-cotton-towel-supplier/index.html
          ls -lh dist/export/south-africa-cotton-towel-supplier/index.html
          ls -lh dist/export/south-america-cotton-towel-supplier/index.html
          ls -lh dist/export/uae-cotton-towel-supplier/index.html
          ls -lh dist/export/saudi-arabia-cotton-towel-supplier/index.html
          ls -lh dist/solutions/hotel-towel-manufacturer/index.html
          ls -lh dist/solutions/private-label-towel-manufacturer/index.html

      - name: Package ADD-ONLY P1 Files (Dynamic Hash Resolution)
        working-directory: ./frontend
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const distDir = path.resolve('dist');
          const addOnlyDir = path.resolve('dist_add_only');

          if (fs.existsSync(addOnlyDir)) {
            fs.rmSync(addOnlyDir, { recursive: true, force: true });
          }
          fs.mkdirSync(addOnlyDir, { recursive: true });

          const p1Routes = [
            'export/usa-cotton-towel-supplier',
            'export/canada-cotton-towel-supplier',
            'export/australia-cotton-towel-supplier',
            'export/south-africa-cotton-towel-supplier',
            'export/south-america-cotton-towel-supplier',
            'export/uae-cotton-towel-supplier',
            'export/saudi-arabia-cotton-towel-supplier',
            'solutions/hotel-towel-manufacturer',
            'solutions/private-label-towel-manufacturer'
          ];

          p1Routes.forEach(r => {
            const src = path.join(distDir, r, 'index.html');
            const dest = path.join(addOnlyDir, r, 'index.html');
            fs.mkdirSync(path.dirname(dest), { recursive: true });
            fs.copyFileSync(src, dest);
          });

          const assetsDir = path.join(distDir, 'assets');
          const destAssetsDir = path.join(addOnlyDir, 'assets');
          fs.mkdirSync(destAssetsDir, { recursive: true });

          if (fs.existsSync(assetsDir)) {
            const assetFiles = fs.readdirSync(assetsDir);
            let count = 0;
            assetFiles.forEach(f => {
              fs.copyFileSync(path.join(assetsDir, f), path.join(destAssetsDir, f));
              count++;
            });
            console.log('Copied ' + count + ' dynamic asset files to dist_add_only/assets.');
          }

          console.log('ADD-ONLY package built successfully.');
          "

      - name: Deploy ADD-ONLY P1 files to Hostinger FTP public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: ./frontend/dist_add_only/
          server-dir: public_html/
          dangerous-clean-slate: false
