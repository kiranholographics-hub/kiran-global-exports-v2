name: Deploy ADD-ONLY prerendered pages to Hostinger

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run mode (lists uploads/deletions without changing files on server)'
        type: boolean
        default: true

jobs:
  build-and-deploy-add-only:
    name: Build & sync ADD-ONLY files to Hostinger
    runs-on: ubuntu-latest

    # Vite bakes this into the bundle at build time and falls back to
    # http://localhost:4000 when it is unset, so a build without it ships a
    # site whose every API call points at the visitor's own machine.
    env:
      VITE_API_URL: https://api.kiranglobal-exports.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build production bundle
        working-directory: ./frontend
        run: npm run build

      - name: Start Preview Server
        working-directory: ./frontend
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 &
          npx --yes wait-on http://127.0.0.1:4173

      - name: Render every landing route with Puppeteer
        working-directory: ./frontend
        run: |
          npm install --no-save puppeteer
          node --input-type=module -e "
          import puppeteer from 'puppeteer';
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          // The route list lives with the app, not in this file — see the
          // note in src/data/deployRoutes.js.
          import { DEPLOY_ROUTES as routes } from './src/data/deployRoutes.js';

          const __dirname = process.cwd();
          console.log('Rendering ' + routes.length + ' routes');

          (async () => {
            let browser;
            try {
              // --disable-web-security (with its own --user-data-dir, which
              // Chrome requires before it honours the flag): the towel pages
              // read the catalogue from /api/products, and the API's origin
              // allow-list has no entry for the throwaway preview server this
              // renders against, so the fetch is blocked, the page never
              // leaves Suspense and the route comes out with no <h1>. Safe
              // here — this browser only ever loads our own freshly built
              // bundle and is thrown away with the runner.
              browser = await puppeteer.launch({
                headless: true,
                args: [
                  '--no-sandbox',
                  '--disable-setuid-sandbox',
                  '--disable-web-security',
                  '--user-data-dir=' + fs.mkdtempSync(path.join(os.tmpdir(), 'render-'))
                ]
              });
              const page = await browser.newPage();

              // Collect every bad route rather than stopping at the first:
              // one run then names all of them instead of surfacing them one
              // failed deploy at a time.
              const broken = [];

              for (const r of routes) {
                const url = 'http://127.0.0.1:4173' + r;
                const res = await page.goto(url, { waitUntil: 'networkidle0', timeout: 30000 });
                await page.evaluate(() => new Promise(resolve => setTimeout(resolve, 1000)));

                const html = await page.content();
                const hasH1 = await page.evaluate(() => !!document.querySelector('h1'));
                const status = res ? res.status() : 0;

                // The specific causes come first: both of them also render
                // without an <h1>, so checking that first would report every
                // one of them as the same uninformative 'no <h1>'.
                let why = null;
                if (status !== 200) why = 'HTTP ' + status;
                else if (html.includes('Page Not Found')) why = 'rendered the not-found page';
                else if (html.includes('load the catalogue')) why = 'the catalogue API call failed';
                else if (!hasH1) why = 'no <h1>';

                if (why) {
                  console.error('  BROKEN  ' + r + '  (' + why + ')');
                  broken.push(r + ' — ' + why);
                  continue;
                }

                const targetDir = path.join(__dirname, 'dist', r.slice(1));
                fs.mkdirSync(targetDir, { recursive: true });
                fs.writeFileSync(path.join(targetDir, 'index.html'), html, 'utf-8');
                console.log('  ok      ' + r);
              }

              if (broken.length) {
                console.error('');
                console.error(broken.length + ' of ' + routes.length + ' routes did not render:');
                broken.forEach(b => console.error('  - ' + b));
                process.exit(1);
              }
              console.log('All ' + routes.length + ' routes rendered.');
            } catch (err) {
              console.error('FATAL RENDER ERROR:', err.message);
              process.exit(1);
            } finally {
              if (browser) await browser.close();
            }
          })();
          "

      - name: Verify the rendered HTML files
        working-directory: ./frontend
        run: |
          node --input-type=module -e "
          import fs from 'node:fs';
          import path from 'node:path';
          import { DEPLOY_ROUTES } from './src/data/deployRoutes.js';

          const required = DEPLOY_ROUTES.map(r => 'dist' + r + '/index.html');

          console.log('VERIFYING ' + required.length + ' STATIC HTML FILES:');
          let hasFailure = false;

          required.forEach(relPath => {
            const absPath = path.resolve(relPath);
            if (!fs.existsSync(absPath)) {
              console.error('❌ MISSING FILE:', relPath);
              hasFailure = true;
              return;
            }
            const stats = fs.statSync(absPath);
            const content = fs.readFileSync(absPath, 'utf-8');

            console.log('  File:', relPath, '| Size:', stats.size, 'bytes');

            if (stats.size < 3072) {
              console.error('❌ FILE TOO SMALL (<3KB):', relPath, 'Size:', stats.size);
              hasFailure = true;
            }
            if (content.includes('Page Not Found')) {
              console.error('❌ FILE CONTAINS Page Not Found:', relPath);
              hasFailure = true;
            }
          });

          if (hasFailure) {
            console.error('VERIFICATION FAILED!');
            process.exit(1);
          }
          console.log('ALL ' + required.length + ' STATIC HTML FILES VERIFIED VALID ✅');
          "

      - name: Package ADD-ONLY files (dynamic hash resolution)
        working-directory: ./frontend
        run: |
          node --input-type=module -e "
          import fs from 'node:fs';
          import path from 'node:path';
          import { DEPLOY_ROUTES } from './src/data/deployRoutes.js';
          const distDir = path.resolve('dist');
          const addOnlyDir = path.resolve('dist_add_only');

          if (fs.existsSync(addOnlyDir)) {
            fs.rmSync(addOnlyDir, { recursive: true, force: true });
          }
          fs.mkdirSync(addOnlyDir, { recursive: true });

          // Copy root index.html so React Router knows every route
          if (fs.existsSync(path.join(distDir, 'index.html'))) {
            fs.copyFileSync(path.join(distDir, 'index.html'), path.join(addOnlyDir, 'index.html'));
            console.log('Copied updated root index.html.');
          }

          const p1Routes = DEPLOY_ROUTES.map(r => r.replace(/^\//, ''));

          p1Routes.forEach(r => {
            const src = path.join(distDir, r, 'index.html');
            const dest = path.join(addOnlyDir, r, 'index.html');
            fs.mkdirSync(path.dirname(dest), { recursive: true });
            fs.copyFileSync(src, dest);
          });

          const assetsDir = path.join(distDir, 'assets');
          const destAssetsDir = path.join(addOnlyDir, 'assets');
          fs.mkdirSync(destAssetsDir, { recursive: true });

          if (fs.existsSync(assetsDir)) {
            const assetFiles = fs.readdirSync(assetsDir);
            let count = 0;
            assetFiles.forEach(f => {
              fs.copyFileSync(path.join(assetsDir, f), path.join(destAssetsDir, f));
              count++;
            });
            console.log('Copied ' + count + ' dynamic asset files to dist_add_only/assets.');
          }

          // Copy the built .htaccess (Vite copies frontend/public/.htaccess into
          // dist/ verbatim during the build step above) — this is the single
          // source of truth, so there is nothing separate to keep in sync.
          const htaccessSrc = path.join(distDir, '.htaccess');
          if (fs.existsSync(htaccessSrc)) {
            fs.copyFileSync(htaccessSrc, path.join(addOnlyDir, '.htaccess'));
            console.log('Copied dist/.htaccess (from frontend/public/.htaccess) to dist_add_only/.htaccess');
          } else {
            console.error('ERROR: dist/.htaccess file missing!');
            process.exit(1);
          }

          console.log('ADD-ONLY package built successfully.');
          "

      # NOTE: The .htaccess in this package (built from frontend/public/.htaccess)
      # replaces the server's existing .htaccess. Review the diff before a non-dry-run deploy.
      - name: Deploy ADD-ONLY files to Hostinger over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./frontend/dist_add_only/
          # This FTP account is scoped to the domain, so its login directory
          # already is the docroot — "public_html/" put every upload in a
          # public_html/public_html/ nobody serves.
          server-dir: ./
          dangerous-clean-slate: false
          # Renamed so the action stops trusting the state file run 13 left
          # behind: it compares that manifest against the local files and
          # never checks the server, so it has reported "0 changes" on every
          # run since while the live site served none of them.
          state-name: .ftp-deploy-sync-state-add-only-v3.json
          dry-run: ${{ inputs.dry_run }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      # The action reports "Sync complete" for whatever FTP endpoint it is
      # given, even one that is not the filesystem serving this domain —
      # that is exactly how run 13 uploaded 165 files and changed nothing
      # anyone could see. A deploy is only real once the live site serves
      # it, so ask the live site and fail if it does not.
      - name: Verify the deploy actually reached the live site
        if: ${{ !inputs.dry_run }}
        run: |
          # Check the body, not the status: the SPA rewrite answers 200 with
          # the old shell for any known prefix, so a status check passes even
          # when nothing was published.
          failed=0
          check() {
            body=$(curl -s "https://www.kiranglobal-exports.com$1?cachebust=${GITHUB_RUN_ID}")
            if printf '%s' "$body" | grep -qF "$2"; then
              echo "  ok       $1"
            else
              echo "  MISSING  $1  (expected to contain: $2)"
              failed=1
            fi
          }
          check "/export/usa-cotton-towel-supplier/" "Cotton towel supplier for United States importers."
          check "/solutions/hotel-towel-manufacturer/" "Hotel towel manufacturer for hospitality buyers."

          # A bundle built without VITE_API_URL points every API call at the
          # visitor's own machine, which breaks the catalogue and the contact
          # form site-wide while every page still looks fine.
          bundle=$(curl -s "https://www.kiranglobal-exports.com/?cachebust=${GITHUB_RUN_ID}" \
            | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' | head -1)
          if [ -n "$bundle" ] && curl -s "https://www.kiranglobal-exports.com$bundle" \
               | grep -q "localhost:4000"; then
            echo "  BAD      $bundle still points at localhost:4000"
            failed=1
          else
            echo "  ok       $bundle points at the real API"
          fi
          # Informational only: whether the catalogue renders depends on the
          # API being up at this moment, which a deploy cannot control.
          for path in "/" "/towels/" "/usa/" ; do
            echo "  info     $(curl -s -o /dev/null -w '%{http_code}' \
              "https://www.kiranglobal-exports.com$path?cachebust=${GITHUB_RUN_ID}")  $path"
          done
          echo "  info     api $(curl -s -o /dev/null -w '%{http_code}' \
            https://api.kiranglobal-exports.com/api/health)  /api/health"

          if [ "$failed" = "1" ]; then
            echo "::error::The upload reported success but www.kiranglobal-exports.com does not serve these pages. Check that server-dir matches the directory this domain is actually served from."
            exit 1
          fi
          echo "Live site is serving the new pages."
