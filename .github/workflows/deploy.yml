name: Deploy ADD-ONLY P1 Landing Pages to Hostinger

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run mode (lists uploads/deletions without changing files on server)'
        type: boolean
        default: true

jobs:
  build-and-deploy-add-only:
    name: Build & Sync ADD-ONLY P1 files to Hostinger public_html
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build production bundle
        working-directory: ./frontend
        run: npm run build

      - name: Start Preview Server
        working-directory: ./frontend
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 &
          npx --yes wait-on http://127.0.0.1:4173

      - name: Render 9 Approved P1 Routes with Puppeteer
        working-directory: ./frontend
        run: |
          npm install --no-save puppeteer
          node -e "
          const puppeteer = require('puppeteer');
          const fs = require('fs');
          const path = require('path');

          const routes = [
            '/export/usa-cotton-towel-supplier',
            '/export/canada-cotton-towel-supplier',
            '/export/australia-cotton-towel-supplier',
            '/export/south-africa-cotton-towel-supplier',
            '/export/south-america-cotton-towel-supplier',
            '/export/uae-cotton-towel-supplier',
            '/export/saudi-arabia-cotton-towel-supplier',
            '/solutions/hotel-towel-manufacturer',
            '/solutions/private-label-towel-manufacturer'
          ];

          (async () => {
            let browser;
            try {
              browser = await puppeteer.launch({
                headless: true,
                args: ['--no-sandbox', '--disable-setuid-sandbox']
              });
              const page = await browser.newPage();

              for (const r of routes) {
                const url = 'http://127.0.0.1:4173' + r;
                console.log('Rendering & validating:', url);
                const res = await page.goto(url, { waitUntil: 'networkidle0', timeout: 30000 });
                
                if (!res || res.status() !== 200) {
                  throw new Error('HTTP Status ' + (res ? res.status() : 'NULL') + ' for route ' + r);
                }

                await page.evaluate(() => new Promise(resolve => setTimeout(resolve, 1000)));

                const html = await page.content();
                const hasH1 = await page.evaluate(() => !!document.querySelector('h1'));

                if (!hasH1) {
                  throw new Error('Missing <h1> element on route: ' + r);
                }
                if (html.includes('Page Not Found')) {
                  throw new Error('Rendered 404 Page Not Found on route: ' + r);
                }

                const targetDir = path.join(__dirname, 'dist', r.slice(1));
                fs.mkdirSync(targetDir, { recursive: true });
                fs.writeFileSync(path.join(targetDir, 'index.html'), html, 'utf-8');
                console.log('Saved valid rendered HTML:', path.join('dist', r.slice(1), 'index.html'));
              }
            } catch (err) {
              console.error('FATAL RENDER ERROR:', err.message);
              process.exit(1);
            } finally {
              if (browser) await browser.close();
            }
          })();
          "

      - name: Verify 9 P1 Static HTML Files Exist & Valid
        working-directory: ./frontend
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');

          const required = [
            'dist/export/usa-cotton-towel-supplier/index.html',
            'dist/export/canada-cotton-towel-supplier/index.html',
            'dist/export/australia-cotton-towel-supplier/index.html',
            'dist/export/south-africa-cotton-towel-supplier/index.html',
            'dist/export/south-america-cotton-towel-supplier/index.html',
            'dist/export/uae-cotton-towel-supplier/index.html',
            'dist/export/saudi-arabia-cotton-towel-supplier/index.html',
            'dist/solutions/hotel-towel-manufacturer/index.html',
            'dist/solutions/private-label-towel-manufacturer/index.html'
          ];

          console.log('VERIFYING 9 P1 STATIC HTML FILES:');
          let hasFailure = false;

          required.forEach(relPath => {
            const absPath = path.resolve(relPath);
            if (!fs.existsSync(absPath)) {
              console.error('❌ MISSING FILE:', relPath);
              hasFailure = true;
              return;
            }
            const stats = fs.statSync(absPath);
            const content = fs.readFileSync(absPath, 'utf-8');

            console.log('  File:', relPath, '| Size:', stats.size, 'bytes');

            if (stats.size < 3072) {
              console.error('❌ FILE TOO SMALL (<3KB):', relPath, 'Size:', stats.size);
              hasFailure = true;
            }
            if (content.includes('Page Not Found')) {
              console.error('❌ FILE CONTAINS Page Not Found:', relPath);
              hasFailure = true;
            }
          });

          if (hasFailure) {
            console.error('VERIFICATION FAILED!');
            process.exit(1);
          }
          console.log('ALL 9 P1 STATIC HTML FILES VERIFIED VALID ✅');
          "

      - name: Package ADD-ONLY P1 Files (Dynamic Hash Resolution)
        working-directory: ./frontend
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const distDir = path.resolve('dist');
          const addOnlyDir = path.resolve('dist_add_only');

          if (fs.existsSync(addOnlyDir)) {
            fs.rmSync(addOnlyDir, { recursive: true, force: true });
          }
          fs.mkdirSync(addOnlyDir, { recursive: true });

          // Copy root index.html to register all P1 routes in React Router
          if (fs.existsSync(path.join(distDir, 'index.html'))) {
            fs.copyFileSync(path.join(distDir, 'index.html'), path.join(addOnlyDir, 'index.html'));
            console.log('Copied updated root index.html with all registered P1 routes.');
          }

          const p1Routes = [
            'export/usa-cotton-towel-supplier',
            'export/canada-cotton-towel-supplier',
            'export/australia-cotton-towel-supplier',
            'export/south-africa-cotton-towel-supplier',
            'export/south-america-cotton-towel-supplier',
            'export/uae-cotton-towel-supplier',
            'export/saudi-arabia-cotton-towel-supplier',
            'solutions/hotel-towel-manufacturer',
            'solutions/private-label-towel-manufacturer'
          ];

          p1Routes.forEach(r => {
            const src = path.join(distDir, r, 'index.html');
            const dest = path.join(addOnlyDir, r, 'index.html');
            fs.mkdirSync(path.dirname(dest), { recursive: true });
            fs.copyFileSync(src, dest);
          });

          const assetsDir = path.join(distDir, 'assets');
          const destAssetsDir = path.join(addOnlyDir, 'assets');
          fs.mkdirSync(destAssetsDir, { recursive: true });

          if (fs.existsSync(assetsDir)) {
            const assetFiles = fs.readdirSync(assetsDir);
            let count = 0;
            assetFiles.forEach(f => {
              fs.copyFileSync(path.join(assetsDir, f), path.join(destAssetsDir, f));
              count++;
            });
            console.log('Copied ' + count + ' dynamic asset files to dist_add_only/assets.');
          }

          // Copy the built .htaccess (Vite copies frontend/public/.htaccess into
          // dist/ verbatim during the build step above) — this is the single
          // source of truth, so there is nothing separate to keep in sync.
          const htaccessSrc = path.join(distDir, '.htaccess');
          if (fs.existsSync(htaccessSrc)) {
            fs.copyFileSync(htaccessSrc, path.join(addOnlyDir, '.htaccess'));
            console.log('Copied dist/.htaccess (from frontend/public/.htaccess) to dist_add_only/.htaccess');
          } else {
            console.error('ERROR: dist/.htaccess file missing!');
            process.exit(1);
          }

          console.log('ADD-ONLY package built successfully.');
          "

      # A previous run reported "Sync complete" for every file yet nothing
      # reached the live docroot, so print what the FTP account actually
      # sees before trusting server-dir. Runs read-only, never fails the job.
      - name: Show what the FTP account sees (diagnostic)
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          # -k because the cert is issued for the hostname, not the bare IP
          # this account connects by; the action itself does not verify either.
          list() {
            echo "===== listing: /$1 ====="
            curl -s -k --ssl-reqd --ftp-pasv --list-only \
              "ftp://$FTP_HOST/$1" --user "$FTP_USER:$FTP_PASS" \
              || echo "(could not list /$1)"
          }
          list ""
          list "public_html/"
          list "public_html/export/"
          list "public_html/assets/"
          list "domains/"

      # NOTE: The .htaccess in this package (built from frontend/public/.htaccess)
      # replaces the server's existing .htaccess. Review the diff before a non-dry-run deploy.
      - name: Deploy ADD-ONLY P1 files to Hostinger FTP public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./frontend/dist_add_only/
          server-dir: public_html/
          dangerous-clean-slate: false
          state-name: .ftp-deploy-sync-state-add-only.json
          dry-run: ${{ inputs.dry_run }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
