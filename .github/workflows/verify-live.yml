# Asks the live site what it is actually serving. Deliberately separate
# from deploy.yml: it builds nothing, so it answers in seconds and can be
# run any time — after a deploy, after a manual File Manager change, or
# when a page looks wrong — without a five-minute build first.
#
# Every check greps the response body. Status codes are useless here: the
# SPA rewrite answers 200 with the old shell for any known prefix, which
# is exactly how a deploy once reported success while publishing nothing.
name: Verify the live site

on:
  workflow_dispatch:

jobs:
  verify:
    name: Check what www.kiranglobal-exports.com serves
    runs-on: ubuntu-latest
    steps:
      - name: Check the live pages
        run: |
          SITE="https://www.kiranglobal-exports.com"
          BUST="?cachebust=${GITHUB_RUN_ID}"
          failed=0

          mkdir -p /tmp/pages

          # Fetch a path once and keep it. Every assertion used to fetch
          # the page again — nine checks against /export meant nine
          # downloads of /export — which is how this check grew to a few
          # hundred requests and started being rate-limited by the host.
          # $1 path; echoes the local file holding the body.
          fetch() {
            local key file
            key=$(printf '%s' "$1" | tr -c 'A-Za-z0-9' '_')
            file="/tmp/pages/$key"
            if [ ! -f "$file" ]; then
              # || true: a timeout must fail its own check, not kill the
              # run under `bash -e` and skip every check after it.
              curl -sL --max-time 30 "$SITE$1$BUST" > "$file" 2>/dev/null || true
              # Be a good citizen on shared hosting.
              sleep 0.3
            fi
            printf '%s' "$file"
          }

          # $1 path, $2 description, $3 string the body must contain
          has() {
            local file
            file=$(fetch "$1")
            if [ ! -s "$file" ]; then
              echo "  NO REPLY $2  — $1 returned nothing (timeout or error)"
              failed=1
            elif grep -qF -- "$3" "$file"; then
              echo "  ok       $2"
            else
              echo "  MISSING  $2  — $1 does not contain: $3"
              failed=1
            fi
          }

          # $1 path, $2 description, $3 string the body must NOT contain
          lacks() {
            local file
            file=$(fetch "$1")
            if [ ! -s "$file" ]; then
              echo "  NO REPLY $2  — $1 returned nothing (timeout or error)"
              failed=1
            elif grep -qF -- "$3" "$file"; then
              echo "  BAD      $2  — $1 still contains: $3"
              failed=1
            else
              echo "  ok       $2"
            fi
          }

          echo "── Landing pages carry their own copy ──"
          has /export/usa-cotton-towel-supplier/ \
            "USA page heading" "Cotton towel supplier for United States importers."
          has /export/usa-cotton-towel-supplier/ \
            "USA page unique intro" "two or three intermediaries"
          has /solutions/hotel-towel-manufacturer/ \
            "Hotel page heading" "Hotel towel manufacturer for hospitality buyers."
          has /solutions/hotel-towel-manufacturer/ \
            "Hotel page unique intro" "A hotel towel fails in one of three ways"

          echo "── Structured data ──"
          has /export/usa-cotton-towel-supplier/ "FAQPage schema" '"@type":"FAQPage"'
          has /export/usa-cotton-towel-supplier/ "BreadcrumbList schema" '"@type":"BreadcrumbList"'

          echo "── Canonical tag matches the URL actually served ──"
          # .htaccess 301-redirects every prerendered route to its
          # trailing-slash form, so a canonical tag naming the slashless
          # version points at a URL that immediately redirects away from
          # itself instead of at the page it's on. Caught this exact way
          # once already (SEO.jsx and generate-seo-files.js both built the
          # URL from the router path with no normalisation) — this check
          # is what would have caught it before it shipped.
          has / "homepage canonical is self-referencing" \
            'rel="canonical" href="https://www.kiranglobal-exports.com/"'
          has /export/poland-cotton-towel-supplier/ "export page canonical has trailing slash" \
            'rel="canonical" href="https://www.kiranglobal-exports.com/export/poland-cotton-towel-supplier/"'
          has /solutions/bulk-hotel-towels/ "solutions page canonical has trailing slash" \
            'rel="canonical" href="https://www.kiranglobal-exports.com/solutions/bulk-hotel-towels/"'
          has /updates/hotel-towel-gsm-guide/ "article canonical has trailing slash" \
            'rel="canonical" href="https://www.kiranglobal-exports.com/updates/hotel-towel-gsm-guide/"'

          echo "── The landing pages are reachable from the site ──"
          # They were orphans: in the sitemap, linked to each other, and
          # linked to from nowhere else on the site — not even /export,
          # which their own breadcrumbs name as their parent.
          for slug in usa canada australia south-africa south-america uae saudi-arabia \
                      uk germany netherlands france spain italy sweden norway \
                      denmark japan south-korea new-zealand; do
            has /export/ "/export links to $slug" "/export/$slug-cotton-towel-supplier"
          done
          has /export/ "/export links to the hospitality guide" "/solutions/hotel-towel-manufacturer"
          has /export/ "/export links to the private label guide" "/solutions/private-label-towel-manufacturer"
          has /export/ "/export links to the India sourcing guide" "/solutions/cotton-towel-manufacturer-india"

          echo "── The market pages are reachable from the site ──"
          # The footer renders on every page, so one check per market on
          # one page covers the whole site.
          for m in usa canada australia south-america poland finland sweden norway; do
            has /about/ "footer links to /$m" "\"/$m\""
          done
          has /usa/ "USA market page links to its sourcing guide" "/export/usa-cotton-towel-supplier"

          echo "── Catalogue is prerendered and indexable ──"
          has  /towels/bath-towels/ "Towel category renders" "<h1"
          lacks /towels/bath-towels/ "Towel category is indexable" "noindex"
          has  /towels/bath-towels/bath-towel/ "Towel product renders" "<h1"
          lacks /towels/bath-towels/bath-towel/ "Towel product is indexable" "noindex"
          has  /linen/bed/ "Linen category renders" "<h1"
          lacks /linen/bed/ "Linen category is indexable" "noindex"

          echo "── Catalogue structured data ──"
          has  /towels/bath-towels/bath-towel/ "Product schema" '"@type":"Product"'
          has  /towels/bath-towels/bath-towel/ "Product breadcrumbs" '"@type":"BreadcrumbList"'
          has  /towels/bath-towels/ "Category breadcrumbs" '"@type":"BreadcrumbList"'
          # Most of the catalogue still carries "[Confirm with Mundada]"
          # where the mill has not given a figure. Honest on the page;
          # read as a fact if it reaches the markup.
          lacks /towels/bath-towels/bath-towel/ "no placeholder spec in the markup" '"weight":"[Confirm'
          # The markup check above passed while the visible spec table
          # still read "[Confirm with Mundada]" to every visitor: the
          # catalogue files are only the source, and the page renders
          # what GET /api/products returns, which is MongoDB. Editing the
          # files without re-running backend/npm run seed changes nothing
          # a visitor sees. Check the body, which is what they read.
          lacks /towels/bath-towels/bath-towel/ "no internal note on the product page" "Confirm with Mundada"
          lacks /towels/bath-towels/ "no internal note on the category page" "Confirm with Mundada"
          lacks /linen/bed/ "no internal note on the linen page" "Confirm with Mundada"
          lacks /about/ "no internal note in the certification strip" "Confirm with Mundada"

          echo "── Every landing page, not just a sample ──"
          # The two checked above were standing in for nine. A page whose
          # copy silently fell back to the shared blocks would have passed
          # every check so far.
          for slug in usa canada australia south-africa south-america uae saudi-arabia \
                      uk germany netherlands france spain italy sweden norway \
                      denmark japan south-korea new-zealand; do
            page="/export/$slug-cotton-towel-supplier/"
            has "$page" "$slug has an h1" "<h1"
            has "$page" "$slug has FAQ markup" '"@type":"FAQPage"'
            has "$page" "$slug has its own buyer list" "Who we supply"
          done
          for slug in hotel-towel-manufacturer private-label-towel-manufacturer cotton-towel-manufacturer-india bulk-hotel-towels; do
            has "/solutions/$slug/" "$slug has an h1" "<h1"
            has "/solutions/$slug/" "$slug has FAQ markup" '"@type":"FAQPage"'
          done
          has /solutions/cotton-towel-manufacturer-india/ \
            "India page names Solapur" "Solapur"
          has /solutions/cotton-towel-manufacturer-india/ \
            "India page names the ports" "Nhava Sheva"
          has /solutions/cotton-towel-manufacturer-india/ \
            "India page answers how to request a quotation" "How do I actually request a quotation"
          has /solutions/bulk-hotel-towels/ \
            "bulk hotel towels page covers packing" "How is a bulk order packed"

          echo "── The structured data actually parses ──"
          # Presence of the string proves nothing: malformed JSON-LD is
          # ignored by Google exactly like markup that was never there.
          # Pull every block out of a page and parse it.
          check_jsonld() {
            JSONLD_FILE=$(fetch "$1")
            export JSONLD_FILE
            if node -e '
              const fs = require("fs");
              const html = fs.readFileSync(process.env.JSONLD_FILE, "utf-8");
              const blocks = [...html.matchAll(
                /<script[^>]*application\/ld\+json[^>]*>([\s\S]*?)<\/script>/g
              )].map(m => m[1]);
              if (!blocks.length) { console.error("no JSON-LD at all"); process.exit(1); }
              const types = [];
              for (const b of blocks) {
                let parsed;
                try { parsed = JSON.parse(b); }
                catch (e) { console.error("unparseable block: " + e.message); process.exit(1); }
                if (!parsed["@context"]) { console.error("block has no @context"); process.exit(1); }
                types.push(parsed["@type"]);
              }
              console.log("    " + blocks.length + " blocks: " + types.join(", "));
            '; then
              echo "  ok       $2"
            else
              echo "  BAD      $2 — JSON-LD is malformed"
              failed=1
            fi
          }
          check_jsonld /export/usa-cotton-towel-supplier/ "landing page JSON-LD parses"
          check_jsonld /towels/bath-towels/bath-towel/ "product page JSON-LD parses"
          check_jsonld /usa/ "market page JSON-LD parses"

          echo "── No broken internal links on the hub pages ──"
          # /export and the footer are where the whole site now hangs off.
          # A typo in either quietly orphans pages again.
          for page in /export/ /usa/ /towels/; do
            hub=$(fetch "$page")
            links=$(grep -oE 'href="/[a-z0-9/-]*"' "$hub" \
              | sed 's/href="//; s/"//' | sort -u)
            broken=0
            total=0
            for link in $links; do
              total=$((total + 1))
              code=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 20 \
                "$SITE$link" 2>/dev/null || echo 000)
              if [ "$code" != "200" ]; then
                echo "  BROKEN   $page -> $link  (HTTP $code)"
                broken=$((broken + 1))
                failed=1
              fi
              sleep 0.2
            done
            [ "$broken" = "0" ] && echo "  ok       $page — all $total internal links resolve"
          done

          echo "── An inquiry can start by email ──"
          # Buyers send their own specification by email; they do not fill
          # in the form. Every CTA on the site used to lead to the form.
          has /export/usa-cotton-towel-supplier/ "landing page offers email" "Email your specification"
          has /towels/bath-towels/bath-towel/ "product page offers email" "Email your specification"
          has /towels/bath-towels/bath-towel/ "product email names the product" "mailto:"
          has /usa/ "market page offers email" "Email your specification"

          echo "── The buyer guides are live ──"
          # Checked by their own URL, not by counting sitemap entries. A
          # count went up once for an unrelated reason and was read as
          # proof an article had published, which it was not.
          # Not "<h1>": index.html carries one inside its <noscript>, so a
          # page serving nothing but the SPA shell passed that check while
          # containing none of the article. Ask for text only the article
          # itself has.
          has /updates/ "the updates page lists the guides" "How to specify a hotel towel"
          has /updates/what-to-send-a-towel-manufacturer-when-you-ask-for-a-quote/ \
            "the quote guide is rendered" "pricing a towel needs six things"
          has /updates/how-to-specify-a-hotel-towel/ \
            "the hotel guide is rendered" "washed at higher temperatures"
          has /updates/zero-twist-ringspun-waffle-which-towel-construction-suits-which-buyer/ \
            "the construction guide is rendered" "what each one is genuinely good at"
          # The body renderer turns "## " into a subheading; if that broke,
          # the guide is one wall of text with the markers still showing.
          has /updates/how-to-specify-a-hotel-towel/ "headings rendered" "The three ways it fails"
          lacks /updates/how-to-specify-a-hotel-towel/ "no raw heading markers" "## "

          echo "── Sitemap ──"
          sitemap=$(curl -sL --max-time 30 "$SITE/sitemap.xml" 2>/dev/null || true)
          count=$(printf '%s' "$sitemap" | grep -c "<loc>" || true)
          echo "  info     sitemap lists $count URLs"
          # 71 static entries plus the active market pages. Well under that
          # means the build shipped the old list, not the new one.
          if [ "$count" -lt 99 ]; then
            echo "  BAD      sitemap has only $count URLs — expected 99+"
            failed=1
          fi
          # A URL that is both listed here and noindex is reported as an
          # error in Search Console, so the legal pages must stay out.
          if printf '%s' "$sitemap" | grep -q "privacy-policy"; then
            echo "  BAD      sitemap still lists the noindex legal pages"
            failed=1
          else
            echo "  ok       sitemap leaves the noindex legal pages out"
          fi
          # Every listed URL redirects to its own trailing-slash form (see
          # the canonical check above) — a sitemap entry without one just
          # makes Google follow that redirect on every crawl instead of
          # requesting the final URL directly.
          if printf '%s' "$sitemap" | grep -qF "<loc>https://www.kiranglobal-exports.com/export/poland-cotton-towel-supplier</loc>"; then
            echo "  BAD      sitemap lists a page URL without its trailing slash"
            failed=1
          else
            echo "  ok       sitemap URLs carry the trailing slash they actually resolve to"
          fi

          echo "── Standalone static pages ──"
          # frontend/public/oshibori/index.html — not a React route, so none
          # of the checks above touch it; verify it shipped and is not the
          # old page it replaced (if any) or a 404 shell.
          # The heading has a <br> between the comma and "made for altitude"
          # (see frontend/public/oshibori/index.html), not a space — match
          # what is actually in the markup.
          has  /oshibori/ "Oshibori page renders" "made for altitude."
          has  /oshibori/ "Oshibori page names the product" "Oshibori,"
          lacks /oshibori/ "Oshibori page is not the 404 shell" "Page Not Found"
          # The five img src references on the page are binary files, so the
          # text-based has()/lacks() above can't check them — ask for the
          # actual HTTP status of each instead.
          for photo in fold_both_sides front_loop_side back_ground_side closeup_open_weave hem_border; do
            code=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 20 \
              "$SITE/oshibori/photos/$photo.jpg" 2>/dev/null || echo 000)
            if [ "$code" = "200" ]; then
              echo "  ok       oshibori photo: $photo.jpg"
            else
              echo "  MISSING  oshibori photo: $photo.jpg  (HTTP $code)"
              failed=1
            fi
          done

          echo "── Product catalogue PDF ──"
          # Linked from the "Download our product catalogue" link on every
          # SEO landing page (frontend/src/pages/SeoLandingPage.jsx) — a
          # binary file, so check HTTP status rather than grep the body.
          has /export/usa-cotton-towel-supplier/ "landing page links the catalogue PDF" "/downloads/kiran-global-exports-catalogue.pdf"
          code=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 20 \
            "$SITE/downloads/kiran-global-exports-catalogue.pdf" 2>/dev/null || echo 000)
          if [ "$code" = "200" ]; then
            echo "  ok       catalogue PDF resolves"
          else
            echo "  MISSING  catalogue PDF  (HTTP $code)"
            failed=1
          fi

          echo "── Hero video supports Range requests (iOS Safari needs this to play at all) ──"
          # Desktop/Android browsers will often still play a video served
          # without Range support by downloading it whole, which is why this
          # class of bug survives testing on a laptop — iOS Safari refuses
          # to play a <video> at all unless the server answers a Range
          # request with 206 and advertises Accept-Ranges: bytes.
          for video in kiran-hero-desktop kiran-hero-mobile; do
            headers=$(curl -sI -H "Range: bytes=0-1023" --max-time 20 "$SITE/videos/$video.mp4" 2>/dev/null || true)
            status_line=$(printf '%s' "$headers" | head -1 | tr -d '\r')
            echo "  info     $video.mp4 headers:"
            printf '%s' "$headers" | sed 's/^/    /'
            # Accept-Ranges is only mandated on a 200 response advertising
            # support in advance; a 206 to an actual Range request is the
            # real proof it works, regardless of whether that header is
            # echoed on this specific response — Content-Range is what's
            # mandatory on a 206 and proves a genuine partial response.
            if printf '%s' "$status_line" | grep -q "206" && printf '%s' "$headers" | grep -qi "^Content-Range:"; then
              echo "  ok       $video.mp4 answers Range requests (206 + Content-Range)"
            else
              echo "  BAD      $video.mp4 does not support Range requests ($status_line) — will not play on iOS Safari"
              failed=1
            fi
          done

          echo "── Bundle points at the real API ──"
          bundle=$(curl -sL --max-time 30 "$SITE/$BUST" \
            | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' | head -1)
          if [ -z "$bundle" ]; then
            echo "  BAD      could not find the main bundle in the homepage"
            failed=1
          elif curl -sL --max-time 30 "$SITE$bundle" | grep -q "localhost:4000"; then
            echo "  BAD      $bundle points at localhost:4000"
            failed=1
          else
            echo "  ok       $bundle points at the real API"
          fi

          echo "── Informational ──"
          echo "  api $(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            https://api.kiranglobal-exports.com/api/health)  /api/health"

          if [ "$failed" = "1" ]; then
            echo "::error::The live site is not serving what this repository builds."
            exit 1
          fi
          echo ""
          echo "Live site checks all passed."
